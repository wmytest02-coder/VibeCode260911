<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테트리스 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            display: flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        .game-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .game-board-wrapper {
            background: rgba(255, 255, 255, 0.15);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 5px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(10, 30px);
            grid-template-rows: repeat(20, 30px);
            gap: 1px;
            background: #1a1a2e;
            padding: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .cell {
            width: 30px;
            height: 30px;
            background: #0f3460;
            border: 1px solid #16213e;
            position: relative;
        }

        .cell.filled {
            background: #e94560;
            box-shadow: inset -2px -2px 3px rgba(0, 0, 0, 0.3), inset 2px 2px 3px rgba(255, 255, 255, 0.1);
        }

        .cell.I { background: #00f0f1; }
        .cell.O { background: #f0e000; }
        .cell.T { background: #a000f0; }
        .cell.S { background: #00f050; }
        .cell.Z { background: #f00000; }
        .cell.J { background: #0000f0; }
        .cell.L { background: #f0a000; }

        .info-panel {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
            width: 200px;
            color: white;
        }

        .info-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .info-item:last-child {
            border-bottom: none;
        }

        .info-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 32px;
            font-weight: bold;
            color: #00f0f1;
        }

        .next-piece {
            background: #1a1a2e;
            border: 2px solid #16213e;
            border-radius: 8px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 20px);
            grid-template-rows: repeat(4, 20px);
            gap: 1px;
            margin-top: 10px;
        }

        .next-piece .cell {
            width: 20px;
            height: 20px;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-start:active {
            transform: translateY(0);
        }

        .btn-pause {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-pause:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-reset {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }

        .controls-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
        }

        .controls-info h3 {
            margin-bottom: 10px;
            color: #00f0f1;
        }

        .status {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-weight: bold;
            min-height: 30px;
        }

        .status.game-over {
            background: rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
        }

        .status.paused {
            background: rgba(255, 165, 0, 0.3);
            color: #ffa500;
        }

        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                padding: 15px;
            }

            .info-panel {
                width: 100%;
            }

            .game-board {
                grid-template-columns: repeat(10, 25px);
                grid-template-rows: repeat(20, 25px);
            }

            .cell {
                width: 25px;
                height: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="game-section">
            <div class="game-board-wrapper">
                <div class="game-board" id="gameBoard"></div>
            </div>
            <div class="status" id="status">준비 완료</div>
        </div>
        
        <div class="info-panel">
            <div class="info-item">
                <div class="info-label">점수</div>
                <div class="info-value" id="score">0</div>
            </div>

            <div class="info-item">
                <div class="info-label">레벨</div>
                <div class="info-value" id="level">1</div>
            </div>

            <div class="info-item">
                <div class="info-label">라인</div>
                <div class="info-value" id="lines">0</div>
            </div>

            <div class="info-item">
                <div class="info-label">다음 블록</div>
                <div class="next-piece" id="nextPiece"></div>
            </div>

            <div class="button-group">
                <button class="btn-start" id="startBtn">시작</button>
                <button class="btn-pause" id="pauseBtn" disabled>일시 정지</button>
                <button class="btn-reset" id="resetBtn">리셋</button>
            </div>

            <div class="controls-info">
                <h3>조작 방법</h3>
                <p>← → : 좌우 이동</p>
                <p>↓ : 빠르게 내리기</p>
                <p>↑ 또는 Z/X : 회전</p>
                <p>SPACE : 일시 정지</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
