<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 슈팅 게임</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>우주 슈팅 게임</h1>
            <div class="score-board">
                <span>점수: <span id="score">0</span></span>
                <span>생명: <span id="lives">3</span></span>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div class="game-info">
            <p id="gameStatus">게임 시작: 마우스로 이동, 클릭해서 발사</p>
            <button id="startBtn" class="btn btn-start">게임 시작</button>
            <button id="resetBtn" class="btn btn-reset" style="display: none;">게임 다시 시작</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
